<div class="card">
    <h2 class="text-2xl font-bold mb-4 text-purple-800">ניהול רכישות במערכת</h2>

    <p-table 
        [value]="purchases" 
        [tableStyle]="{ 'min-width': '60rem' }" 
        [paginator]="true" 
        [rows]="10"
        [rowsPerPageOptions]="[5, 10, 20]"
        styleClass="p-datatable-striped">
        
        <ng-template pTemplate="header">
            <tr>
                <th class="w-1/12">מזהה</th>
                <th class="w-2/12">שם לקוח</th>
                <th class="w-2/12">אימייל</th>
                <th class="w-2/12">שם מתנה</th>
                <th class="w-1/12">מחיר</th>
                <th class="w-2/12">תאריך רכישה</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-purchase>
            <tr>
                <td>{{ purchase.id }}</td>
                <td>
                    <span class="font-bold">{{ purchase.customerName }}</span>
                </td>
                <td>{{ purchase.customerEmail }}</td>
                <td>
                    <p-tag [value]="purchase.giftName" severity="info"></p-tag>
                </td>
                <td>
                    <span class="text-green-600 font-medium">
                        {{ purchase.giftPrice | currency:'ILS':'symbol':'1.0-0' }}
                    </span>
                </td>
                <td>{{ purchase.purchDate | date: 'dd/MM/yyyy HH:mm' }}</td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="6" class="text-center p-5 text-gray-500">
                    לא נמצאו רכישות שתואמות לחיפוש.
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
